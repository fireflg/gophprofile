apiVersion: v1
kind: Service
metadata:
  name: {{ include "avatars-service.fullname" . }}
  labels:
    {{- include "avatars-service.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.httpPort }}
      targetPort: http
      protocol: TCP
    - name: metrics
      port: {{ .Values.service.metricsPort }}
      targetPort: metrics
      protocol: TCP
  selector:
    {{- include "avatars-service.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: server
