nameOverride: ""
fullnameOverride: ""

image:
  repository: avatars-service
  tag: ""
  pullPolicy: IfNotPresent
  pullSecrets: []

server:
  replicaCount: 1
  terminationGracePeriodSeconds: 30
  preStopSleepSeconds: 5
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  pdb:
    enabled: false
    minAvailable: 1

worker:
  replicaCount: 1
  terminationGracePeriodSeconds: 30
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []
  resources:
    requests:
      cpu: 100m
      memory: 192Mi
    limits:
      cpu: "1"
      memory: 768Mi
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  pdb:
    enabled: false
    minAvailable: 1

service:
  type: ClusterIP
  httpPort: 8080
  metricsPort: 9090

ingress:
  enabled: false
  className: nginx
  annotations: {}
  host: avatars.local
  path: /
  pathType: Prefix
  tls: []

config:
  appEnv: production
  logLevel: info
  http:
    port: 8080
    readTimeout: 30s
    writeTimeout: 60s
    shutdownTimeout: 15s
  postgres:
    maxConns: 10
    minConns: 2
    maxConnLifetime: 1h
  s3:
    endpoint: minio:9000
    bucket: avatars
    region: us-east-1
    useSSL: false
    publicBaseURL: ""
  kafka:
    brokers: kafka:9092
    topic: avatars.events
    groupID: avatars-worker
    clientID: avatars-service
  media:
    maxFileSize: 10485760
    allowedMimeTypes: image/jpeg,image/png,image/webp
    thumbnailSizes: 100x100,300x300
  otel:
    enabled: true
    endpoint: otel-collector:4317
    insecure: true
    sampleRatio: 1
  metrics:
    enabled: true
    port: 9090
    path: /metrics

secrets:
  create: true
  existingSecret: ""
  postgresDSN: postgres://avatars:avatars@postgres:5432/avatars?sslmode=disable
  s3AccessKey: minioadmin
  s3SecretKey: minioadmin

vault:
  enabled: false
  image: hashicorp/vault:1.18
  address: http://vault:8200
  authPath: kubernetes
  role: avatars-service
  secretPath: secret/data/avatars-service
  keys:
    postgresDSN: postgres_dsn
    s3AccessKey: s3_access_key
    s3SecretKey: s3_secret_key

migrations:
  enabled: true
  image: migrate/migrate:v4.18.1

serviceAccount:
  create: true
  name: ""
  annotations: {}

rbac:
  create: true

podSecurity:
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  labelNamespace: false

networkPolicy:
  enabled: true
  defaultDeny: true
  ingressControllerNamespace: ingress-nginx
  monitoringNamespace: monitoring
  dns:
    enabled: true
    namespace: kube-system
    podLabels:
      k8s-app: kube-dns
  egress:
    rules:
      - to:
          - ipBlock:
              cidr: 10.0.0.0/8
        ports:
          - port: 5432
            protocol: TCP
          - port: 9000
            protocol: TCP
          - port: 9092
            protocol: TCP
          - port: 4317
            protocol: TCP
          - port: 8200
            protocol: TCP

serviceMonitor:
  enabled: false
  interval: 15s
  scrapeTimeout: 10s
  labels: {}

grafanaDashboards:
  enabled: false
  label: grafana_dashboard
  labelValue: "1"
  annotations: {}
