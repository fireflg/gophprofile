name: avatars-service

x-app-env: &app-env
  APP_ENV: docker
  LOG_LEVEL: info
  POSTGRES_DSN: postgres://avatars:avatars@postgres:5432/avatars?sslmode=disable
  S3_ENDPOINT: minio:9000
  S3_ACCESS_KEY: minioadmin
  S3_SECRET_KEY: minioadmin
  S3_BUCKET: avatars
  S3_PUBLIC_BASE_URL: http://localhost:9000/avatars
  KAFKA_BROKERS: kafka:29092
  KAFKA_TOPIC: avatars.events
  KAFKA_GROUP_ID: avatars-worker
  MAX_FILE_SIZE: "10485760"
  THUMBNAIL_SIZES: 100x100,300x300
  OTEL_ENABLED: "true"
  OTEL_EXPORTER_OTLP_ENDPOINT: otel-collector:4317
  OTEL_EXPORTER_OTLP_INSECURE: "true"
  METRICS_ENABLED: "true"
  METRICS_PORT: "9090"

services:
  server:
    build:
      context: ../..
      dockerfile: docker/application/Dockerfile
      args:
        APP: server
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
    environment:
      <<: *app-env
      OTEL_SERVICE_NAME: avatars-server
    ports:
      - "8080:8080"
      - "9101:9090"

  worker:
    build:
      context: ../..
      dockerfile: docker/application/Dockerfile
      args:
        APP: worker
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
    environment:
      <<: *app-env
      OTEL_SERVICE_NAME: avatars-worker
    ports:
      - "9102:9090"
